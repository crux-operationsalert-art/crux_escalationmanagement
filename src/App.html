<script>
/* ==========================================================
   Crux Escalation Matrix — SPA
   Single-file Vanilla JS. Views render into #app.
   ========================================================== */
(function() {
  var BOOT = window.__BOOTSTRAP__ || {};
  var DEEP = BOOT.deepLink || {};
  var PREVIEW = ['LOCATION_HEAD','MANAGER','VIEWER'].indexOf(DEEP.preview) !== -1 ? DEEP.preview : '';

  var _realUser = BOOT.user || { email:'', role:'VIEWER', active:false };
  var _shownUser = _realUser;
  var _shownNav = BOOT.nav || [];
  if (PREVIEW && _realUser.role === 'ADMIN') {
    // Draw the app the way PREVIEW role sees it. Display only.
    _shownUser = { email: _realUser.email, role: PREVIEW, active: _realUser.active };
    var NAVS = {
      MANAGER: [{key:'dashboard',label:'Dashboard'},{key:'clients',label:'Clients'},
                {key:'escalations',label:'Escalations'},{key:'warnings',label:'Warnings'},{key:'logs',label:'Logs'}],
      LOCATION_HEAD: [{key:'dashboard',label:'Dashboard'},{key:'clients',label:'My Clients'},
                {key:'escalations',label:'Escalations'},{key:'warnings',label:'Warnings'}],
      VIEWER: [{key:'dashboard',label:'Dashboard'},{key:'clients',label:'Matrix'},
                {key:'escalations',label:'Escalations'}]
    };
    _shownNav = NAVS[PREVIEW] || _shownNav;
  }

  var state = {
    user: _shownUser,
    realRole: _realUser.role,
    preview: PREVIEW,
    app: BOOT.app || {},
    nav: _shownNav,
    route: DEEP.route || 'dashboard',
    routeParams: {},
    cache: {}
  };
  if (DEEP.tab) { state.routeParams.escTab = DEEP.tab; state.routeParams.clientTab = DEEP.tab; }

  /* --------------------- RPC wrapper --------------------- */
  var _rpcPending = 0;
  function setBusy(on) {
    _rpcPending = Math.max(0, _rpcPending + (on ? 1 : -1));
    var sp = document.getElementById('busy');
    if (sp) sp.style.display = _rpcPending > 0 ? 'flex' : 'none';
  }
  /* ---------------- session credential ----------------
     The server hands us a session id once, when an invite link is exchanged in
     doGet. We keep it in sessionStorage - per tab, cleared when the tab closes,
     and never in the URL, so it cannot be bookmarked, shared, screenshotted or
     leaked in a Referer header. The address bar is scrubbed immediately below.

     This replaces the old permanent ?t= token, which was the identity on every
     request and therefore turned the URL itself into a transferable credential. */
  var SESSION_KEY = 'crux.sid';
  function readSid() {
    try { return window.sessionStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; }
  }
  function writeSid(v) {
    try { v ? window.sessionStorage.setItem(SESSION_KEY, v)
            : window.sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  if (BOOT && BOOT.sessionId) writeSid(BOOT.sessionId);

  // Client hints, so the server can bind the session to this browser.
  var CLIENT_META = (function() {
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    return { ua: navigator.userAgent || '', lang: navigator.language || '', tz: tz };
  })();

  // Remove the one-time code from the visible URL so it cannot be copied or
  // re-opened. The exchange already burned it server-side; this stops a stale
  // link sitting in history and confusing the next person on this machine.
  (function scrubUrl() {
    try {
      if (!window.history || !window.history.replaceState) return;
      var loc = window.location;
      if (loc.search.indexOf('t=') === -1) return;
      var kept = loc.search.replace(/^\?/, '').split('&').filter(function(kv) {
        return kv && kv.split('=')[0] !== 't';
      }).join('&');
      window.history.replaceState({}, document.title,
        loc.pathname + (kept ? '?' + kept : '') + loc.hash);
    } catch (e) {}
  })();

  function rpc(action, payload) {
    // Carry the session id on every call. Colleagues on personal Gmail accounts
    // have no Workspace identity for the server to read, so without this they
    // would be identified on the first page load and anonymous thereafter.
    var sid = readSid();
    if (sid) {
      payload = payload || {};
      if (payload.__s === undefined) payload.__s = sid;
      if (payload.__m === undefined) payload.__m = CLIENT_META;
    }
    setBusy(true);
    var slowTimer = setTimeout(function(){ toast('Still working… Google Sheets can be slow. Please wait.', 'info'); }, 8000);
    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res) return reject(new Error('No response from server'));
          if (!res.ok) return reject(new Error(res.error || 'Request failed'));
          resolve(res.data);
        })
        .withFailureHandler(function(err) {
          reject(new Error(err && err.message ? err.message : (err ? String(err) : 'Server error')));
        })
        .rpc(action, payload || {});
    }).finally(function(){ setBusy(false); clearTimeout(slowTimer); });
  }

  /* --------------------- Toast + Modal --------------------- */
  function toast(msg, kind) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || 'ok');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.className = 'toast'; }, 3000);
  }
  var Modal = {
    open: function(opts) {
      document.getElementById('modal-title').textContent = opts.title || '';
      document.getElementById('modal-body').innerHTML = opts.body || '';
      var foot = document.getElementById('modal-foot'); foot.innerHTML = '';
      // .filter(Boolean): callers build action lists with inline conditionals that
      // yield null for hidden buttons; without this the loop throws on a.label.
      (opts.actions || [{ label:'Close', kind:'secondary', close:true }]).filter(Boolean).forEach(function(a) {
        var b = document.createElement('button');
        b.className = 'btn ' + (a.kind || '');
        b.textContent = a.label;
        b.setAttribute('data-testid', a.testid || ('modal-action-' + (a.label||'').toLowerCase().replace(/\s+/g,'-')));
        b.onclick = function() {
          if (b._busy) return;
          if (!a.onClick) { if (a.close) Modal.close(); return; }
          b._busy = true;
          var orig = b.textContent;
          b.textContent = 'Working…';
          b.style.opacity = '0.7';
          var restore = function(){ b._busy = false; b.textContent = orig; b.style.opacity = '1'; };
          try {
            var r = a.onClick();
            if (r && typeof r.then === 'function') {
              // Async: restore + optionally close only after the promise settles.
              r.then(function(){ if (a.close) Modal.close(); }, function(){})
               .then(restore, restore);
            } else {
              // Sync completion.
              restore();
              if (a.close) Modal.close();
            }
          } catch (e) {
            restore();
            toast(e.message || String(e), 'err');
          }
        };
        foot.appendChild(b);
      });
      document.getElementById('modal').classList.remove('hidden');
      // Auto-attach the person type-ahead whenever a modal containing those
      // fields is opened. Doing it here means neither escalation form needs to
      // remember to call it, and nothing breaks if the field is absent.
      try {
        if (document.getElementById('r-person')) attachPersonSuggest('r-person','raise-against-email');
        attachClientPrefill('e-client','e-brcode','e-name','e-phone');
        attachClientPrefill('r-client','r-brcode',null,null);
        if (document.getElementById('e-against')) attachPersonSuggest('e-against','log-against-email');
      } catch (e) {}
    },
    close: function() { document.getElementById('modal').classList.add('hidden'); }
  };
  document.addEventListener('click', function(e){
    if (e.target && e.target.id === 'modal-close') Modal.close();
    if (e.target && e.target.id === 'modal') Modal.close();
  });

  /* --------------------- Helpers --------------------- */
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.slice(0,2) === 'on') el[k.toLowerCase()] = v;
      else if (k === 'testid') el.setAttribute('data-testid', String(v));
      else el.setAttribute(k, String(v));
    });
    (children || []).forEach(function(c) {
      if (c == null || c === false) return;
      if (c && c.nodeType) el.appendChild(c);
      else el.appendChild(document.createTextNode(String(c)));
    });
    return el;
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function fmtDate(v) { if (!v) return ''; var d = new Date(v); return isNaN(d) ? String(v).slice(0,19).replace('T',' ') : d.toLocaleString(); }

  /* --------------------- Router --------------------- */
  var Routes = {};
  function go(route, params) {
    state.route = route; state.routeParams = params || {};
    render();
  }
  function currentNavKey() { return state.route.split(':')[0]; }

  /* --------------------- Shell --------------------- */
  function render() {
    // ROBUSTNESS FIX: every render needs the #app shell from Index.html. If it is
    // absent, the old code threw at `app.innerHTML` and then the catch block
    // dereferenced the SAME null element — throwing a second time and escaping
    // the handler as an uncaught "Cannot set properties of null". Check once,
    // up front, and report the actual cause on screen.
    var app = document.getElementById('app');
    if (!app) {
      var msg = 'Startup error: the page shell is missing.\n\n'
        + 'No element with id="app" exists in the page.\n\n'
        + 'Most likely cause: Index.html is not the file it should be.\n\n'
        + 'How to check, in the Apps Script editor:\n'
        + '  1. Open Index.html.\n'
        + '  2. Line 1 must be:  <!DOCTYPE html>\n'
        + '  3. It must contain: <div id="app">\n\n'
        + 'If Index.html instead begins with a <script> tag, the contents of\n'
        + 'App.html were pasted into it by mistake. Each file must receive its\n'
        + 'own contents.\n\n'
        + 'After fixing, publish again:\n'
        + '  Deploy > Manage deployments > pencil icon > Version: New version > Deploy';
      try {
        if (document.body) {
          var pre = document.createElement('pre');
          pre.textContent = msg;
          pre.setAttribute('style', 'white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,'
            + 'Consolas,monospace;padding:20px;margin:24px;color:#912018;background:#fef3f2;'
            + 'border:1px solid #fda29b;border-radius:8px');
          document.body.innerHTML = '';
          document.body.appendChild(pre);
        }
      } catch (e) {}
      try { console.error(msg); } catch (e) {}
      return;
    }
    try {
      if (!state.user.email) return renderLogin(app);
      // "Signed in, but no profile here" is a different thing from "registered and
      // waiting". The approval form patches an existing USERS row, so showing it
      // to somebody with no row asked them to fill in a form that could never
      // save. Tell them the truth instead.
      if (state.user.unknown) return renderNoAccess(app);
      if (!state.user.active) return renderPendingApproval(app);
      app.innerHTML = '';
      var shell = h('div', { class: 'app-shell' }, [renderSidebar(), renderMain()]);
      app.appendChild(shell);
    } catch (err) {
      // Reuse the already-validated `app`; never re-query and dereference here,
      // or a failure in the handler escapes as an uncaught error.
      try {
        app.innerHTML = '';
        app.appendChild(h('div',{class:'main'},[
          h('div',{class:'callout err'},['Something went wrong rendering this page: ' + (err && err.message ? err.message : String(err))]),
          h('button',{class:'btn secondary', onclick: function(){ state.route = 'dashboard'; state.routeParams = {}; render(); }},['Back to dashboard'])
        ]));
      } catch (e2) {
        try { app.textContent = 'Render failed: ' + (err && err.message ? err.message : String(err)); } catch (e3) {}
      }
      try { console.error(err); } catch (e) {}
    }
  }

  function renderSidebar() {
    var items = state.nav.map(function(n) {
      var el = h('div', {
        class: 'nav-item' + (currentNavKey() === n.key ? ' active' : ''),
        testid: 'nav-' + n.key,
        onclick: function(){ go(n.key); }
      }, [h('span',{class:'dot'}, []), n.label]);
      return el;
    });
    return h('div', { class:'sidebar' }, [
      h('div',{class:'sidebar-brand'},[ 'CRUX', h('small',{},['Escalation Matrix']) ]),
      h('div',{},items),
      h('div',{class:'sidebar-user'},[
        h('div',{}, [h('b',{}, [state.user.name || state.user.email])]),
        h('div',{class:'muted'},[state.user.email]),
        h('div',{style:'margin-top:6px'}, [h('span',{class:'role-pill'},[state.user.role])]),
        state.app.testMode ? h('div',{style:'margin-top:6px'}, [h('span',{class:'badge warn'}, ['TEST MODE'])]) : null,
        // Somebody handing a shared machine to a colleague had no way to end
        // their own session, so the next person inherited it.
        h('div',{style:'margin-top:8px'},[
          h('button',{class:'btn secondary small', testid:'btn-signout', onclick: signOut},['Sign out'])
        ])
      ])
    ]);
  }

  function renderMain() {
    var view = Routes[state.route] || Routes[currentNavKey()] || Routes.dashboard;
    var container = h('div',{class:'main', testid:'view-'+currentNavKey()}, []);
    try { view(container); }
    catch (err) {
      container.innerHTML = '';
      container.appendChild(h('div',{class:'callout err'},['Unable to render this view: ' + (err && err.message ? err.message : String(err))]));
    }
    return container;
  }

  /* --------------------- Login / Pending --------------------- */
  function renderLogin(app) {
    app.innerHTML = '';
    var kids = [
      h('div',{class:'brand-tag'},['Crux Risk Management']),
      h('h1',{},['Client Escalation Matrix'])
    ];
    // A used or expired invite link is the most likely reason somebody lands
    // here, so say exactly that rather than a generic sign-in message.
    if (BOOT && BOOT.signInError) {
      kids.push(h('div',{class:'callout err', testid:'signin-error'},[BOOT.signInError]));
    }
    kids.push(h('p',{class:'muted'},['Sign in with your Crux Google account to continue. If you use a personal email address for work, open the tool from the personal invitation link your administrator sent you.']));
    kids.push(h('div',{class:'callout'},['Access is restricted to authorised users. Your invitation link works once - if you need another, ask your administrator to resend it.']));
    app.appendChild(h('div',{class:'login-shell'}, kids));
  }

  /* Signed in with a real Google account that has no profile in this tool. */
  function renderNoAccess(app) {
    app.innerHTML = '';
    app.appendChild(h('div',{class:'login-shell'},[
      h('div',{class:'brand-tag'},['Access']),
      h('h1',{},['No access to this tool']),
      h('div',{class:'callout err', testid:'no-access'},[
        'You are signed in as ' + (state.user.email || 'an unrecognised account') +
        ', which does not have a profile on the Crux Escalation Matrix.']),
      h('p',{class:'muted'},['Nothing has been created for you and no data has been shared. If you should have access, ask an administrator to add your profile and send you an invitation.']),
      h('div',{style:'margin-top:14px'},[
        h('button',{class:'btn secondary', testid:'btn-signout', onclick: signOut},['Sign out'])
      ])
    ]));
  }

  /* End the session on this browser. Server-side revoke, then local clear. */
  function signOut() {
    var done = function() {
      writeSid('');
      try { window.sessionStorage.clear(); } catch (e) {}
      window.location.reload();
    };
    rpc('auth.signOut', {}).then(done).catch(done);
  }
  function renderPendingApproval(app) {
    app.innerHTML = '';
    var form = h('div',{class:'login-shell'},[
      h('div',{class:'brand-tag'},['Access Request']),
      h('h1',{},['Awaiting approval']),
      h('p',{class:'muted'},['Your account is registered but needs admin approval. Please provide a few details to help the admin verify you.']),
      h('div',{class:'form-row'},[
        makeField('name','Full name', state.user.name),
        makeField('mobile','Mobile number','')
      ]),
      // Department first, because it decides which designation ladder applies.
      // Operations runs the escalation matrix; every other department only
      // raises escalations and handles warnings.
      h('div',{class:'form-row'},[
        h('div',{class:'field'},[
          h('label',{},['Department']),
          (function(){
            var sel = h('select',{ id:'department', testid:'field-department',
              onchange: function(){ refreshDesignations(); } },
              ["Operations","HR","Finance","IT","Admin","Sales","Other"].map(function(d){ return h('option',{value:d},[d]); }));
            return sel;
          })()
        ]),
        h('div',{class:'field'},[
          h('label',{},['Designation']),
          h('select',{ id:'designation', testid:'field-designation' },[])
        ])
      ]),
      h('div',{class:'form-row'},[
        h('div',{class:'field'},[h('label',{},['Are you a Crux employee or a partner?']),
          h('select',{ id:'employeeType', testid:'field-employeeType',
            onchange: function(){ refreshDesignations(); } },[
            h('option',{value:'EMPLOYEE'},['Crux employee']),
            h('option',{value:'PARTNER'},['Partner (not a Crux employee)'])])]),
        h('div',{class:'field', id:'partner-wrap', style:'display:none'},[
          h('label',{},['Partner company name']),
          h('input',{ id:'partnerCompany', testid:'field-partnerCompany' })])
      ]),
      h('div',{class:'form-row'},[
        makeField('employeeId','Employee / Partner ID',''),
        makeField('dateOfJoining','Date of joining (yyyy-mm-dd)','')
      ]),
      h('div',{class:'form-row'},[
        makeField('manager','Reporting manager email',''),
        h('div',{class:'field'},[h('label',{},['']), h('div',{class:'muted', id:'dept-hint',
          style:'font-size:12px;padding-top:6px'},[''])])
      ]),
      h('button',{class:'btn', testid:'submit-access-request', onclick: function(){
        var payload = { name: val('name'), mobile: val('mobile'), department: val('department'),
          designation: val('designation'), manager: val('manager'),
          employeeType: val('employeeType'), partnerCompany: val('partnerCompany'),
          employeeId: val('employeeId'), dateOfJoining: val('dateOfJoining') };
        rpc('auth.requestAccess', payload).then(function(){ toast('Request sent to admin','ok'); }).catch(function(e){ toast(e.message,'err'); });
      }},['Submit request'])
    ]);
    app.appendChild(form);
    setTimeout(refreshDesignations, 0);
  }
  function makeField(id, label, value) {
    return h('div',{class:'field'},[
      h('label',{ 'for': id }, [label]),
      h('input',{ id: id, testid: 'input-'+id, value: value || '' }, [])
    ]);
  }
  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  /* ============ DASHBOARD ============ */
  /* ---- Ask my data ----
     Available to every role, not just Admin. Safe because aiChat_ scopes its
     snapshot to the caller: a Location Head is only ever answered about their
     own clients. */
  function renderAskBox(root) {
    var card = h('div',{class:'card', style:'margin-bottom:14px'},[]);
    root.appendChild(card);
    var thread = [];
    function paint(busy) {
      card.innerHTML = '';
      card.appendChild(h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'},[
        h('div',{},[
          h('h3',{style:'margin:0'},['Ask my data']),
          h('p',{class:'muted', style:'margin:4px 0 0'},['Plain-English questions about the escalations and clients you can see.'])
        ]),
        thread.length ? h('button',{class:'btn secondary small', testid:'btn-ask-clear',
          onclick: function(){ thread = []; paint(false); }},['Clear']) : null
      ]));
      if (thread.length) {
        var log = h('div',{style:'margin:12px 0;display:flex;flex-direction:column;gap:8px'},[]);
        thread.forEach(function(m) {
          log.appendChild(h('div',{
            style:'padding:9px 12px;border-radius:9px;max-width:46em;'
              + (m.role === 'user'
                  ? 'background:rgba(0,0,0,.05);align-self:flex-end'
                  : 'background:var(--emerald-100, rgba(16,185,129,.10))')
          },[m.text]));
        });
        card.appendChild(log);
      }
      var row = h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'},[
        h('input',{ id:'ask-q', testid:'input-ask', style:'flex:1;min-width:240px',
          placeholder: busy ? 'Thinking...' : 'e.g. which escalations are overdue?',
          onkeydown: function(e){ if (e.key === 'Enter') send(); } }),
        h('button',{class:'btn', testid:'btn-ask-send', onclick: send},[busy ? 'Asking...' : 'Ask'])
      ]);
      card.appendChild(row);
      if (!thread.length) {
        var chips = ['What is overdue right now?','Which clients have an incomplete matrix?','Summarise this month'];
        card.appendChild(h('div',{style:'display:flex;gap:6px;flex-wrap:wrap;margin-top:8px'},
          chips.map(function(q){
            return h('button',{class:'btn secondary small', onclick: function(){
              var el = document.getElementById('ask-q'); if (el) el.value = q; send();
            }},[q]);
          })));
      }
    }
    function send() {
      var el = document.getElementById('ask-q');
      var q = el ? String(el.value || '').trim() : '';
      if (!q) return;
      thread.push({ role:'user', text:q });
      paint(true);
      rpc('ai.chat',{ messages: thread.map(function(m){ return { role:m.role, text:m.text }; }) })
        .then(function(r){
          thread.push({ role:'assistant', text: (r && r.text) ? r.text : String(r) });
          paint(false);
        })
        .catch(function(e){
          thread.push({ role:'assistant', text:'Could not answer: ' + e.message });
          paint(false);
        });
    }
    paint(false);
  }

  Routes.dashboard = function(root) {
    root.appendChild(h('div',{class:'pageheader'},[
      h('div',{},[h('h1',{},['Dashboard']), h('div',{class:'sub'},[state.app.company])]),
      h('div',{},[ state.user.role === 'ADMIN'
        ? h('button',{class:'btn secondary small', onclick: openAutomation, testid:'btn-view-automation'},['View automation'])
        : null ])
    ]));

    // Quick actions. Only what this role can actually do.
    var acts = [];
    if (canEdit()) {
      acts.push(h('button',{class:'btn small', testid:'qa-raise', onclick: openRaiseEscalation},['+ Raise escalation']));
      acts.push(h('button',{class:'btn secondary small', testid:'qa-log', onclick: openLogEscalation},['Log escalation']));
    }
    acts.push(h('button',{class:'btn secondary small', testid:'qa-list', onclick: function(){ go('escalations', { escTab:'List' }); }},['All escalations']));
    acts.push(h('button',{class:'btn secondary small', testid:'qa-mis', onclick: function(){ go('escalations', { escTab:'MIS' }); }},['MIS report']));
    if (state.user.role === 'ADMIN') {
      acts.push(h('button',{class:'btn secondary small', testid:'qa-import', onclick: openBulkImport},['Import clients']));
    }
    root.appendChild(h('div',{class:'btn-row', style:'margin-bottom:16px'}, acts));

    var container = h('div',{},[h('div',{class:'empty'},['Loading dashboard...'])]);
    root.appendChild(container);

    // Rendered outside the summary promise so a failed RPC cannot take the
    // Ask box and the AI snapshot down with it.
    renderAskBox(root);
    if (aiEnabled() && (state.user.role === 'ADMIN' || state.user.role === 'MANAGER')) {
      var snapCard = h('div',{class:'card', testid:'weekly-snapshot', style:'margin-top:14px'},[]);
      snapCard.appendChild(h('h3',{},['This week - AI spotted', aiHint(),
        h('button',{class:'btn secondary small', style:'margin-left:auto', testid:'btn-refresh-snapshot', onclick: function(){ loadSnapshot(snapCard, true); }},['Refresh'])
      ]));
      snapCard.appendChild(h('div',{class:'snap-wrap', id:'snap-wrap'},[
        h('div',{class:'empty', style:'grid-column:1/-1;padding:12px'},['Loading anomalies...'])
      ]));
      snapCard.appendChild(h('div',{class:'muted', id:'snap-meta', style:'font-size:11px;margin-top:8px'},[]));
      root.appendChild(snapCard);
      loadSnapshot(snapCard, false);
    }

    rpc('dashboard.summary').then(function(d){
      container.innerHTML = '';
      var t    = d.totals || {};
      var ag   = d.ageing || {};
      var dp   = d.dispatch || {};
      var isExec = (d.role === 'ADMIN' || d.role === 'MANAGER');

      // Drill-through. Only wired where the MIS actually supports the filter.

  function loadSnapshot(card, refresh) {
    var wrap = card.querySelector('.snap-wrap');
    var meta = card.querySelector('#snap-meta');
    if (refresh) wrap.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:12px">Refreshing…</div>';
    rpc('ai.weeklyAnomalies', { refresh: !!refresh }).then(function(r){
      wrap.innerHTML = '';
      if (r.skipped) { wrap.innerHTML = '<div class="callout" style="grid-column:1/-1">Enable Gemini in <b>Admin → AI</b> to see weekly anomaly cards here.</div>'; meta.textContent = ''; return; }
      if (r.error) { wrap.innerHTML = '<div class="callout err" style="grid-column:1/-1">AI unavailable: '+esc(r.error)+'</div>'; meta.textContent = ''; return; }
      var items = r.anomalies || [];
      if (!items.length) { wrap.innerHTML = '<div class="empty" style="grid-column:1/-1">No anomalies noted this week — nice and quiet.</div>'; }
      items.forEach(function(a, i){
        wrap.appendChild(h('div',{class:'snap-card '+a.severity, testid:'snap-card-'+i},[
          h('span',{class:'snap-sev '+a.severity},[a.severity]),
          h('div',{class:'snap-title'},[a.title || '—']),
          h('div',{class:'snap-detail'},[a.detail || '']),
          a.suggestion ? h('div',{class:'snap-suggest'},[h('b',{},['Try']), a.suggestion]) : null
        ]));
      });
      var when = r.generatedAt || (r.ts ? new Date(r.ts).toLocaleString() : '');
      meta.textContent = 'Generated ' + when + ' · cached up to 6h. Click ↻ Refresh to regenerate.';
    }).catch(function(e){ wrap.innerHTML = ''; meta.textContent = 'AI: ' + e.message; });
  }

  function kvRow(k, v) { return h('div',{class:'kv'},[h('div',{class:'k'},[k]), h('div',{},[String(v||'—')])]); }

  function validateMatrixClient(c, rows) {
    var missing = []; var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/; var PHONE = /^[0-9+\-\s()]{7,}$/;
    if (!c.ClientEmail || !EMAIL.test(c.ClientEmail)) missing.push('Client Email');
    var lv = { 1:'SPOC',2:'Team Leader',3:'Branch Manager',4:'Zonal Manager',5:'Head Office' };
    Object.keys(lv).forEach(function(k){
      var r = rows.filter(function(x){ return String(x.Level) === String(k); })[0] || {};
      if (!r.ContactName) missing.push(lv[k] + ' — Name');
      if (!r.Mobile || !PHONE.test(r.Mobile)) missing.push(lv[k] + ' — Mobile');
      if (!r.Email || !EMAIL.test(r.Email)) missing.push(lv[k] + ' — Email');
    });
    return { complete: !missing.length, missing: missing };
  }

  /* One grid renderer for all three scopes: client-wide, client+location, and

     typing nothing must leave the level inheriting rather than copying the
     inherited value into a hard override on save. */
  /* Client > Location > Branch. Opening a branch shows THAT branch's matrix,
     which is where a branch-level override belongs. Editing the branch's own
     details stays available from here rather than being the default action. */
  function openBranchMatrix(b, d) {
    state.routeParams.branchId = b.BranchID;
    Modal.open({
      title: b.BranchName + (b.BranchCode ? ('  (' + b.BranchCode + ')') : ''),
      body: '<div class="muted" style="margin-bottom:6px">' +

    }, 60);

  function paintMatrixGrid(grid, clientId, branchId, location, title, subtitle) {
    grid.innerHTML = '<div class="empty">Loading matrix...</div>';
    rpc('matrix.get', { clientId: clientId, branchId: branchId || '', location: location || '' })
      .then(function(rows) {
        grid.innerHTML = '';
        grid.appendChild(h('div',{style:'display:flex;align-items:center;gap:8px;margin:6px 0 10px;flex-wrap:wrap'},[
          h('b',{},[title]),
          h('span',{class:'muted', style:'font-size:12px'},[subtitle || '']),
          canEdit() ? h('button',{class:'btn small', style:'margin-left:auto',
            testid:'btn-save-matrix-' + (branchId || location || 'client'),
            onclick: function(){ saveMatrixScoped(clientId, branchId, location, grid, title, subtitle); }
          },['Save']) : null

  /* Overview: the DEFAULT matrix for this client at a chosen location. A client
     may hold a different default per location, so the location is picked here
     rather than assumed. Blank levels fall back to the client-wide default. */
  function renderLocationDefaultMatrix(body, d) {
    var clientId = d.client.ClientID;
    var branches = (d.branches || []).filter(function(b){ return b.Status !== 'INACTIVE'; });
    // Case-insensitive, because the matrix resolver matches location that way.
    // A plain indexOf listed 'PUNE' and 'pune' as two separate location defaults
    // while the server treated them as one, so editing either silently
    // overwrote the other. Show one entry, using the commonest spelling.
    var locations = (function() {
      var byKey = {};
      branches.forEach(function(b) {
        var l = String(b.Location || '').trim();
        if (!l) return;
        var k = l.toUpperCase();
        var e = byKey[k] || (byKey[k] = { counts: {}, best: l, n: 0 });
        e.counts[l] = (e.counts[l] || 0) + 1;
        if (e.counts[l] > e.n) { e.n = e.counts[l]; e.best = l; }
      });
      return Object.keys(byKey).sort().map(function(k){ return byKey[k].best; });
    })();
    var sel = state.routeParams.mxLoc;
    if (sel === undefined) sel = locations.length ? locations[0] : '';

    var card = h('div',{class:'card', style:'margin-top:14px'},[]);
    card.appendChild(h('h3',{},['Default escalation matrix']));
    card.appendChild(h('div',{class:'muted', style:'margin-bottom:10px'},[
      'The starting point for every branch at a location. A branch can override any level.'
    ]));

    var scopes = [{ id:'', label:'All locations (client-wide)' }].concat(
      locations.map(function(l){ return { id:l, label:l }; }));
    card.appendChild(h('div',{class:'tabs', testid:'loc-scope-tabs'}, scopes.map(function(s){
      return h('div',{ class:'tab' + (sel === s.id ? ' active' : ''),
        testid:'locscope-' + (s.id || 'all'),
        onclick: function(){ state.routeParams.mxLoc = s.id; render(); } },[s.label]);
    })));
    if (!locations.length) {
      card.appendChild(h('div',{class:'muted', style:'font-size:12px;margin-bottom:8px'},[
        'No branch has a Location yet, so only the client-wide default applies. ' +
        'Add Location on a branch to hold a separate default for it.'
      ]));
    }
    var grid = h('div',{},[h('div',{class:'empty'},['Loading...'])]);
    card.appendChild(grid);
    body.appendChild(card);
    paintMatrixGrid(grid, clientId, '', sel,
      sel ? ('Default for ' + sel) : 'Client-wide default',
      sel ? 'applies to every branch in ' + sel : 'applies where no location default exists');
  }

  function parseTable(raw) {
    var lines = String(raw||'').replace(/\r/g,'').split('\n').filter(function(l){ return l.trim(); });
    if (!lines.length) return [];
    var sep = lines[0].indexOf('\t') !== -1 ? '\t' : ',';
    var headers = splitCsv(lines[0], sep);
    return lines.slice(1).map(function(line){
      var cells = splitCsv(line, sep);
      var obj = {}; headers.forEach(function(h, i){ obj[h.trim()] = (cells[i] || '').trim(); });
      return obj;
    });
  }
  function splitCsv(line, sep) {
    var out = []; var cur = ''; var inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = !inQ;
      else if (ch === sep && !inQ) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  }

        ]));
      }
    }).catch(function(e) {
      body.innerHTML = '';
      body.appendChild(h('div',{class:'callout danger'},['Could not load your score: ' + e.message]));
    });
  }

  function decideMyScore(decision, s, card) {

      title: reject ? 'Reject this score' : 'Accept this score',
      body: '<div class="callout">' + (reject

  function renderTeam(card) {
    card.innerHTML = '';
    card.appendChild(h('h3',{},['My team',
      h('button',{class:'btn secondary small', style:'margin-left:auto', testid:'btn-team-kpis',
        onclick: function(){ openKpiForm(null, card); }},['Set team KPIs']),
      h('button',{class:'btn small', testid:'btn-add-member',
        onclick: function(){ openMemberForm(null, card); }},['+ Add team member'])
    ]));
    var body = h('div',{},[h('div',{class:'empty'},['Loading team...'])]);
    card.appendChild(body);

    rpc('team.list').then(function(rows){
      body.innerHTML = '';
      if (!rows.length) {
        body.appendChild(h('div',{class:'empty'},[
          'Nobody reports to you yet. Use Add team member - their profile is created for you.'
        ]));
        return;
      }
      // A flat list of everyone below you hides who reports to whom. Build the
      // actual tree from the Manager field and indent it, so two levels down is
      // visibly two levels down.
      var byMgr = {};
      var mine = String((state.user && state.user.email) || '').toLowerCase();
      rows.forEach(function(m){
        var k = String(m.Manager || '').toLowerCase();
        (byMgr[k] = byMgr[k] || []).push(m);
      });
      var seen = {};
      var wrap = h('div',{testid:'team-tree'},[]);

      var rowFor = function(m, depth) {
        var statusTone = m.EmploymentStatus === 'ACTIVE' ? 'ok'
          : (m.EmploymentStatus === 'EXITED' || m.EmploymentStatus === 'INACTIVE') ? 'neutral' : 'warn';
        var kids = byMgr[String(m.Email).toLowerCase()] || [];
        var lm = m.lastMonth || {};
        // achievementPct is null when nothing was set and undefined on older rows,
        // which rendered literally as 'last undefined%'.
        var lastTxt = (lm.achievementPct == null ? '-' : lm.achievementPct + '%') +
          (lm.score == null || lm.score === '' ? '' : ('  score ' + lm.score));
        var showLast = (lm.achievementPct != null) || (lm.score != null && lm.score !== '');

        return h('div',{class:'card', testid:'team-node-'+m.Email,
          style:'margin:0 0 8px ' + (depth * 26) + 'px;padding:10px 12px;border-left:3px solid ' +
                (depth === 0 ? 'var(--ink-900,#17150f)' : '#d9d3c8')},[
          h('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:8px'},[
            h('div',{style:'min-width:200px'},[
              h('b',{},[m.Name]),
              m.EmployeeType === 'PARTNER' ? h('span',{class:'badge info', style:'margin-left:6px'},['Partner']) : null,
              h('div',{class:'muted', style:'font-size:11px'},[m.Email])
            ]),
            h('div',{style:'min-width:140px'},[
              h('div',{},[m.Designation || '-']),
              h('div',{class:'muted', style:'font-size:11px'},[m.Department || ''])
            ]),
            h('span',{class:'badge ' + statusTone},[(m.EmploymentStatus||'ACTIVE').replace('_',' ')]),
            kids.length ? h('span',{class:'badge neutral'},[kids.length + ' report' + (kids.length>1?'s':'')]) : null,
            // Process RAG, shown for the whole tree.
            ragChip('Targets', m.targetRag),
            ragChip('Score', m.scoreRag),
            showLast ? h('span',{class:'badge neutral', title:'Last month'},['last ' + lastTxt]) : null,
            m.openWarnings ? h('span',{class:'badge warn'},[m.openWarnings + ' warning' + (m.openWarnings>1?'s':'')]) : null,
            m.openPip ? h('span',{class:'badge danger'},['PIP to ' + m.pipEnds]) : null,

            // ONE action row. Targets and scoring belong to the direct manager;
            // appreciation, PIP and warnings reach the whole tree.
            h('div',{style:'display:flex;flex-wrap:wrap;gap:4px;margin-left:auto'},[
              m.isDirect ? h('button',{class:'btn secondary small', onclick: function(){ openMemberForm(m, card); }},['Edit']) : null,
              m.isDirect ? h('button',{class:'btn secondary small', onclick: function(){ openTargetForm(m, card); }},['Targets']) : null,
              m.isDirect ? h('button',{class:'btn secondary small', onclick: function(){ openKpiForm(m, card); }},['KPIs']) : null,
              m.isDirect ? h('button',{class:'btn secondary small', onclick: function(){ openScoreForm(m, card); }},['Score']) : null,
              m.isDirect ? null : h('span',{class:'badge neutral', title:'Their own manager sets targets and scores'},['targets: their manager']),
              h('button',{class:'btn secondary small', onclick: function(){ openPeopleAction(m, card, 'appreciate'); }},['Appreciate']),
              h('button',{class:'btn secondary small', onclick: function(){ openPeopleAction(m, card, 'pip'); }},['PIP']),
              h('button',{class:'btn secondary small', onclick: function(){ openPeopleAction(m, card, 'warn'); }},['Warn'])
            ])
          ])
        ]);
      };

      var walk = function(managerEmail, depth) {
        (byMgr[managerEmail] || []).forEach(function(m){
          var key = String(m.Email).toLowerCase();
          if (seen[key]) return;      // a bad Manager loop must not hang the page
          seen[key] = true;
          wrap.appendChild(rowFor(m, depth));
          walk(key, depth + 1);
        });
      };
      walk(mine, 0);

      // Anyone whose manager is outside this subtree still has to appear.
      var orphans = rows.filter(function(m){ return !seen[String(m.Email).toLowerCase()]; });
      if (orphans.length) {
        wrap.appendChild(h('div',{class:'muted', style:'margin:10px 0 6px;font-size:12px'},[
          'Not linked under you directly - check their Reports to field:'
        ]));
        orphans.forEach(function(m){
          seen[String(m.Email).toLowerCase()] = true;
          wrap.appendChild(rowFor(m, 0));
        });
      }
      body.appendChild(wrap);
      body.appendChild(h('div',{class:'muted', style:'font-size:12px;margin-top:8px'},[
        'You set targets, scores, appreciations, PIPs and warnings for your ' +
        'direct reports. Everyone deeper in the chain is shown because you are ' +
        'accountable for the result - their performance reaches your score through ' +
        'the team roll-up - but their own manager acts on their record.'
      ]));
      body.appendChild(h('div',{class:'muted', style:'font-size:12px;margin-top:6px'},[
        'You can see the escalations and branches of everyone in this list. Warnings, PIPs and appreciations are emailed to the person.'
      ]));
    }).catch(function(e){
      body.innerHTML = '';
      body.appendChild(h('div',{class:'callout danger'},['Could not load the team: ' + e.message]));
    });
  }

          if (!cats.length) { toast('Give at least one KPI','err'); return false; }

          var scope = scopeEl ? scopeEl.value : 'PERSON';
          return rpc('kpis.set', { Email: m ? m.Email : '', Scope: scope, Categories: cats })
            .then(function(r){

              if (card) renderTeam(card); else render();

  /**
   * Target editor. Driven by the person's ACTUAL KPIs, with per-client allocation.
   *
   * This used to iterate a hard-coded TARGET_CATS = Revenue / Business
   * Development / Collection and offer "Save all three". Two problems: KPIs are
   * configurable, so anybody given a custom set had their targets written against
   * categories that were not theirs and the server rightly refused them; and a
   * KPI could not be divided across clients at all.
   *
   * Now each KPI is either one combined figure or a set of client allocations,
   * never both, matching what the server enforces.
   */
  function openTargetForm(m, card) {
    Modal.open({
      title: 'Targets - ' + m.Name,
      wide: true,
      body: '<div id="tg-body" class="empty">Loading their KPIs...</div>',
      actions: [{ label: 'Close', kind: 'secondary', close: true }]
    });
    var state = { mk: m.MonthKey || '', clients: [], kpis: [] };

    function load() {
      var body = document.getElementById('tg-body');
      if (!body) return;
      return Promise.all([
        rpc('kpis.get', { Email: m.Email }),
        rpc('score.get', { Email: m.Email, MonthKey: state.mk }).catch(function(){ return null; }),
        state.clients.length ? Promise.resolve({ items: state.clients })
                             : rpc('clients.list', {}).catch(function(){ return { items: [] }; })
      ]).then(function(res) {
        var kpiInfo = res[0] || {};
        var score = res[1] || {};
        state.clients = (res[2] && (res[2].items || res[2])) || [];
        state.kpis = kpiInfo.categories || [];
        state.allocMax = kpiInfo.allocationMax || 50;
        state.canEdit = kpiInfo.canEdit !== false;
        var byCat = {};
        ((score.achievement && score.achievement.categories) || score.targetsByCategory || [])
          .forEach(function(c) { byCat[c.Category] = c; });
        paint(byCat);
      }).catch(function(e) {
        var b = document.getElementById('tg-body');
        if (b) b.innerHTML = '<div class="callout danger">' + esc(e.message) + '</div>';
      });
    }

    function clientOptions(selected) {
      return '<option value="">- whole KPI (no client split) -</option>' +
        state.clients.map(function(c) {
          return '<option value="' + esc(c.ClientID) + '"' +
            (String(selected) === String(c.ClientID) ? ' selected' : '') + '>' +
            esc(c.ClientName) + '</option>';
        }).join('');
    }

    function paint(byCat) {
      var body = document.getElementById('tg-body');
      if (!body) return;
      var html = '<div class="form-row"><div class="field"><label>Month</label>' +
        '<input id="tg-month" data-testid="input-target-month" value="' + esc(state.mk) +
        '" placeholder="2026-08"></div></div>';

      if (!state.kpis.length) {
        html += '<div class="callout">No KPIs are configured for ' + esc(m.Name) +
                ' yet. Set their KPIs first.</div>';
        body.innerHTML = html;
        return;
      }
      if (!state.canEdit) {
        html += '<div class="callout">You can see these targets but only ' +
                esc(m.Name) + '\u2019s reporting manager can change them.</div>';
      }

      state.kpis.forEach(function(cat, ci) {
        var d = byCat[cat] || {};
        var allocs = (d.allocations || []).filter(function(a) {
          return a.ClientID || a.SubCategory;
        });
        html += '<div class="card" style="margin-top:12px" data-testid="kpi-block-' + ci + '">' +
          '<h4 style="margin:0 0 8px">' + esc(cat) +
          (d.set ? ' <span class="muted" style="font-weight:400">' +
                   'total ' + esc(String(d.target)) + ', achieved ' + esc(String(d.achieved)) +
                   ' (' + esc(String(d.pct)) + '%)</span>' : '') +
          '</h4>';

        if (allocs.length) {
          html += '<table style="width:100%;border-collapse:collapse">' +
            '<tr><th style="text-align:left;padding:4px 6px;font-size:11px;color:#8a8377">CLIENT / SPLIT</th>' +
            '<th style="text-align:left;padding:4px 6px;font-size:11px;color:#8a8377">TARGET</th>' +
            '<th style="text-align:left;padding:4px 6px;font-size:11px;color:#8a8377">ACHIEVED</th>' +
            '<th></th></tr>';
          allocs.forEach(function(a, ai) {
            var id = ci + '-' + ai;
            html += '<tr>' +
              '<td style="padding:4px 6px">' + esc(a.ClientName || a.SubCategory || '-') + '</td>' +
              '<td style="padding:4px 6px"><input id="tg-at-' + id + '" style="width:90px" value="' +
                esc(String(a.target == null ? '' : a.target)) + '"></td>' +
              '<td style="padding:4px 6px"><input id="tg-aa-' + id + '" style="width:90px" value="' +
                esc(String(a.achieved == null ? '' : a.achieved)) + '"></td>' +
              '<td style="padding:4px 6px">' +
                '<button class="btn secondary small" data-testid="btn-alloc-save-' + id + '" ' +
                  'data-act="save-alloc" data-cat="' + esc(cat) + '" data-cid="' + esc(a.ClientID || '') +
                  '" data-sub="' + esc(a.SubCategory || '') + '" data-id="' + id + '">Save</button> ' +
                '<button class="btn secondary small" data-testid="btn-alloc-remove-' + id + '" ' +
                  'data-act="remove-alloc" data-cat="' + esc(cat) + '" data-cid="' + esc(a.ClientID || '') +
                  '" data-sub="' + esc(a.SubCategory || '') + '">Remove</button>' +
              '</td></tr>';
          });
          html += '</table>' +
            '<div class="muted" style="margin-top:4px;font-size:12px">' +
            allocs.length + ' of ' + state.allocMax + ' client allocations used.</div>';
        } else {
          // No split yet: one combined figure for the whole KPI.
          html += '<div class="form-row">' +
            '<div class="field"><label>Target</label><input id="tg-t-' + ci + '" data-testid="input-target-' + ci + '" value="' +
              esc(String(d.set ? d.target : '')) + '"></div>' +
            '<div class="field"><label>Achieved</label><input id="tg-a-' + ci + '" data-testid="input-achieved-' + ci + '" value="' +
              esc(String(d.achievedRecorded ? d.achieved : '')) + '"></div>' +
            '</div>' +
            '<button class="btn secondary small" data-act="save-combined" data-cat="' + esc(cat) +
              '" data-id="' + ci + '" data-testid="btn-save-combined-' + ci + '">Save ' + esc(cat) + '</button>' +
            (d.set ? ' <button class="btn secondary small" data-act="remove-combined" data-cat="' + esc(cat) +
              '" data-testid="btn-remove-combined-' + ci + '">Remove</button>' : '');
        }

        // Add a split. Offered whether or not one exists; the server refuses
        // mixing a combined figure with slices and says why.
        html += '<div class="form-row" style="margin-top:8px">' +
          '<div class="field"><label>Add a client allocation</label>' +
            '<select id="tg-nc-' + ci + '" data-testid="select-alloc-client-' + ci + '">' +
            clientOptions('') + '</select></div>' +
          '<div class="field"><label>or a sub-category</label>' +
            '<input id="tg-ns-' + ci + '" data-testid="input-alloc-sub-' + ci + '" placeholder="e.g. Retail"></div>' +
          '<div class="field"><label>Target</label><input id="tg-nt-' + ci + '" data-testid="input-alloc-target-' + ci + '"></div>' +
          '<div class="field"><label>&nbsp;</label>' +
            '<button class="btn secondary small" data-act="add-alloc" data-cat="' + esc(cat) +
              '" data-id="' + ci + '" data-testid="btn-alloc-add-' + ci + '">Add</button></div>' +
          '</div>';
        html += '</div>';
      });

      html += '<div class="field" style="margin-top:10px"><label>Note (optional)</label>' +
              '<input id="tg-note" data-testid="input-target-note"></div>';
      body.innerHTML = html;
      wire();
    }

    function wire() {
      var body = document.getElementById('tg-body');
      if (!body) return;
      Array.prototype.forEach.call(body.querySelectorAll('button[data-act]'), function(btn) {
        btn.onclick = function(ev) {
          ev.preventDefault();
          state.mk = val('tg-month') || state.mk;
          var act = btn.getAttribute('data-act');
          var cat = btn.getAttribute('data-cat');
          var id  = btn.getAttribute('data-id');
          var base = { Email: m.Email, MonthKey: state.mk, Category: cat, Notes: val('tg-note') };
          var p;
          if (act === 'save-combined') {
            p = rpc('team.setTarget', Object.assign({}, base,
              { TargetValue: val('tg-t-' + id), AchievedValue: val('tg-a-' + id) }));
          } else if (act === 'remove-combined') {
            p = rpc('team.removeTarget', base);
          } else if (act === 'save-alloc') {
            p = rpc('team.setTarget', Object.assign({}, base, {
              ClientID: btn.getAttribute('data-cid'), SubCategory: btn.getAttribute('data-sub'),
              TargetValue: val('tg-at-' + id), AchievedValue: val('tg-aa-' + id) }));
          } else if (act === 'remove-alloc') {
            p = rpc('team.removeTarget', Object.assign({}, base, {
              ClientID: btn.getAttribute('data-cid'), SubCategory: btn.getAttribute('data-sub') }));
          } else if (act === 'add-alloc') {
            var cid = val('tg-nc-' + id), sub = val('tg-ns-' + id);
            if (!cid && !sub) { toast('Choose a client or name a sub-category.', 'err'); return; }
            p = rpc('team.setTarget', Object.assign({}, base,
              { ClientID: cid, SubCategory: sub, TargetValue: val('tg-nt-' + id) }));
          } else { return; }

          btn.disabled = true;
          p.then(function() {
            toast('Saved', 'ok');
            return load();                 // repaint from the server, never from guesswork
          }).then(function() {
            renderTeam(card);
          }).catch(function(e) {
            toast(e.message, 'err');
          }).then(function() {
            btn.disabled = false;
          });
        };
      });
    }

    load();
  }

  /* Monthly score. Rating plus all three written sections are mandatory - a score
     with no explanation is not something an employee can fairly accept or reject. */

      title: 'Score ' + m.Name,

      wide: true,
      actions: [{ label:'Cancel', kind:'secondary', close:true },
        { label:'Save score', testid:'btn-save-score', onClick: function(){
          return rpc('score.save', { Email: m.Email, MonthKey: m.MonthKey,
              ManagerRating: val('sc-rating'), Comments: val('sc-comments'),

        '<tr><th style="text-align:left;padding:4px 8px">Source</th><th style="text-align:left;padding:4px 8px">Reason</th>' +
        '<th style="text-align:left;padding:4px 8px">On</th><th style="text-align:right;padding:4px 8px">Delta</th>' +
        '<th style="text-align:right;padding:4px 8px">After</th></tr>' + led + '</table>' +
        '<div class="field"><label>Your rating out of 10 (attendance, behaviour, teamwork, people management)*</label>' +
        '<input id="sc-rating" placeholder="0-10"></div>' +
        '<div class="field"><label>Performance comments*</label><textarea id="sc-comments" rows="3"></textarea></div>' +
        '<div class="field"><label>Areas of improvement*</label><textarea id="sc-improve" rows="3"></textarea></div>' +
        '<div class="field"><label>Next month expectations*</label><textarea id="sc-next" rows="3"></textarea></div>';

      attachAiDraft('sc-improve', 'pip', function(){ return 'Areas to improve for ' + m.Name; });
      attachAiDraft('sc-next', 'note', function(){ return 'Next month expectations for ' + m.Name; });
    }).catch(function(e){
      var b = document.getElementById('sc-body');
      if (b) b.innerHTML = '<div class="callout danger">' + esc(e.message) + '</div>';
    });

  var WARN_CATS = [
    ['ATTENDANCE','Attendance or punctuality'],
    ['CONDUCT','Behaviour or misconduct'],
    ['UNIFORM','Uniform, grooming or turnout'],
    ['PROCESS','Process or SOP violation'],
    ['SAFETY','Safety or security lapse'],
    ['PERFORMANCE','Performance shortfall'],
    ['CLIENT','Client complaint'],
    ['ESCALATION','Unanswered escalation'],
    ['OTHER','Other']
  ];

  function openPeopleAction(m, card, kind) {
    var cfg = {
      appreciate: { title:'Appreciate ' + m.Name, route:'team.appreciate', label:'Send appreciation',
        blurb:'Recorded and emailed to them. It also lifts their attribute score.',
        ph:'What did they do well?', ai:'appreciation' },
      pip: { title:'Performance improvement plan - ' + m.Name, route:'team.pipStart', label:'Start PIP',
        blurb:'A dated plan. They are emailed the dates and the reason.',
        ph:'What needs to improve, and how it will be measured', ai:'pip' },
      warn: { title:'Warn ' + m.Name, route:'team.warn', label:'Record warning',
        blurb:'A factual record, emailed to them. No escalation is needed - pick the type below.',
        ph:'What happened, when, and what must change', ai:'warning' }
    }[kind];

    var catField = kind === 'warn'
      ? '<div class="field"><label>Type of warning*</label><select id="pa-cat" data-testid="select-warn-cat">' +
        WARN_CATS.map(function(c){ return '<option value="'+c[0]+'">'+c[1]+'</option>'; }).join('') +
        '</select><div class="muted" style="font-size:11px;margin-top:3px">' +
        'This tells the AI what kind of letter to draft.</div></div>'
      : '';
    var dates = kind === 'pip'
      ? '<div class="form-row"><div class="field"><label>Start date*</label><input id="pa-start" placeholder="yyyy-mm-dd"></div>' +
        '<div class="field"><label>End date*</label><input id="pa-end" placeholder="yyyy-mm-dd"></div></div>' : '';

    Modal.open({
      title: cfg.title,
      body: '<div class="callout">' + cfg.blurb + '</div>' + catField + dates +
            '<div class="field"><label>Details*</label>' +
            '<textarea id="pa-notes" rows="4" placeholder="'+cfg.ph+'"></textarea></div>',
      actions: [{ label:'Cancel', kind:'secondary', close:true },
        { label: cfg.label, testid:'btn-people-'+kind, onClick: function(){
          var notes = val('pa-notes');
          if (!notes || notes.trim().length < 10) { toast('Please write at least 10 characters.','err'); return false; }
          var payload = { Email: m.Email, Notes: notes };
          if (kind === 'warn') payload.Category = val('pa-cat');
          if (kind === 'pip') { payload.StartDate = val('pa-start'); payload.EndDate = val('pa-end'); }
          return rpc(cfg.route, payload).then(function(r){
            Modal.close();
            var s = r.sent || {};
            toast((s.attempted && s.ok === false)
              ? 'Recorded, but the email did not send'
              : 'Recorded and emailed', (s.attempted && s.ok === false) ? 'info' : 'ok');
            renderTeam(card);
          }).catch(function(e){ toast(e.message,'err'); });
        } }]
    });

    // AI drafting, with the warning TYPE fed in as context so the letter matches
    // the situation rather than being generic.
    attachAiDraft('pa-notes', cfg.ai, function(){
      var cat = kind === 'warn' ? (val('pa-cat') || 'OTHER') : '';
      var catLabel = '';
      WARN_CATS.forEach(function(c){ if (c[0] === cat) catLabel = c[1]; });
      return (catLabel ? (catLabel + '. ') : '') +
        'About ' + (m.Name || m.Email) + ', ' + (m.Designation || '') + ', ' + (m.Department || '') + '.';
    });
  }

    }).catch(function(e){

        });

          'placeholder="What happened, when, and what must change"></textarea></div>' +

        '<label style="display:flex;gap:8px;align-items:center;margin-top:6px">' +
          '<input type="checkbox" id="wp-send" checked> Send the warning letter now</label>',
      actions: [{ label:'Cancel', kind:'secondary', close:true },
        { label:'Raise warning', testid:'btn-confirm-warning2', onClick: function(){
          var person = val('wp-person');

  /* ---- Person / team type-ahead ----
     Sourced live from USERS + BRANCHES via directory.suggest, so people appear
     as soon as they are added - nothing to maintain here.
     If the person is not in the directory we ask for an email address, because
     an escalation with no reachable owner cannot be chased. */
  function attachPersonSuggest(inputId, emailInputId) {
    var input = document.getElementById(inputId);
    if (!input) return;
    var box = document.createElement('div');
    box.setAttribute('data-testid', 'suggest-' + inputId);
    box.style.cssText = 'position:relative;display:none;border:1px solid var(--line);border-radius:8px;'
      + 'background:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:230px;overflow:auto;z-index:50;margin-top:4px';
    input.parentNode.appendChild(box);
    var emailWrap = document.getElementById(emailInputId + '-wrap');
    var timer = null, lastQ = '';

    function setEmail(val) {
      var el = document.getElementById(emailInputId);
      if (el) el.value = val || '';
    }
    function showEmailAsk(show, why) {
      if (!emailWrap) return;
      emailWrap.style.display = show ? '' : 'none';
      var lbl = emailWrap.querySelector('[data-role="why"]');
      if (lbl) lbl.textContent = why || '';
    }
    function close() { box.style.display = 'none'; box.innerHTML = ''; }

    function paint(items, q) {
      box.innerHTML = '';
      if (!items.length) {
        close();
        showEmailAsk(true, '\u201c' + q + '\u201d is not in the directory - enter an email so this escalation can be sent and chased.');
        setEmail('');
        return;
      }
      items.forEach(function(it) {
        var row = document.createElement('button');
        row.type = 'button';
        row.setAttribute('data-testid', 'suggest-item');
        row.style.cssText = 'display:block;width:100%;text-align:left;border:0;background:transparent;'
          + 'padding:8px 10px;cursor:pointer;font:inherit';
        row.onmouseover = function(){ row.style.background = 'rgba(0,0,0,.04)'; };
        row.onmouseout  = function(){ row.style.background = 'transparent'; };
        var tag = it.kind === 'USER' ? 'person' : it.kind.toLowerCase();
        row.innerHTML = '<b>' + esc(it.label) + '</b>'
          + ' <span class="badge" style="font-size:.7em">' + tag + '</span>'
          + (it.sub ? '<br><span class="muted" style="font-size:.85em">' + esc(it.sub) + '</span>' : '')
          + (it.email ? '<br><span class="muted mono" style="font-size:.8em">' + esc(it.email) + '</span>' : '');
        row.onclick = function() {
          input.value = it.label;
          setEmail(it.email || '');
          close();
          showEmailAsk(!it.email, it.email ? '' : 'No email on record for \u201c' + it.label + '\u201d - enter one so it can be chased.');
        };
        box.appendChild(row);
      });
      box.style.display = '';
    }

    input.setAttribute('autocomplete','off');
    input.addEventListener('input', function() {
      var q = input.value.trim();
      if (timer) clearTimeout(timer);
      if (q.length < 1) { close(); showEmailAsk(false); return; }
      timer = setTimeout(function() {
        if (q === lastQ) return;
        lastQ = q;
        rpc('directory.suggest',{ q:q })
          .then(function(r){ paint((r && r.items) || [], q); })
          .catch(function(){ close(); });
      }, 180);
    });
    input.addEventListener('blur', function(){ setTimeout(close, 200); });
  }

  function ingestFiles(fileList) {
    var list = document.getElementById('r-att-list');
    var TOTAL_LIMIT = 20 * 1024 * 1024;
    var current = Routes._raiseAttachments.reduce(function(s,a){ return s + (a._size||0); }, 0);
    Array.prototype.forEach.call(fileList, function(f) {
      if (current + f.size > TOTAL_LIMIT) { toast('Attachment '+f.name+' skipped — 20MB total limit','err'); return; }
      current += f.size;
      var reader = new FileReader();
      reader.onload = function() {
        var base64 = reader.result.split(',')[1] || '';
        Routes._raiseAttachments.push({ name: f.name, mimeType: f.type || 'application/octet-stream', dataBase64: base64, _size: f.size });
        renderAttList();
      };
      reader.readAsDataURL(f);
    });
    function renderAttList() {
      list.innerHTML = Routes._raiseAttachments.map(function(a, i){
        return '<div>📎 '+esc(a.name)+' <span class="muted">('+prettySize(a._size)+')</span> <a href="#" data-i="'+i+'" class="rm-att">remove</a></div>';
      }).join('');
      list.querySelectorAll('.rm-att').forEach(function(el){
        el.addEventListener('click', function(e){ e.preventDefault(); Routes._raiseAttachments.splice(parseInt(el.getAttribute('data-i'),10), 1); renderAttList(); });
      });
      updateAttBar();
    }
    updateAttBar();
  }
  function updateAttBar() {
    var TOTAL_LIMIT = 20 * 1024 * 1024;
    var fill = document.getElementById('r-att-fill');
    var meta = document.getElementById('r-att-meta');
    if (!fill || !meta) return;
    var used = Routes._raiseAttachments.reduce(function(s,a){ return s + (a._size||0); }, 0);
    var pct = Math.min(100, Math.round((used / TOTAL_LIMIT) * 100));
    fill.style.width = pct + '%';
    fill.className = 'att-bar-fill' + (pct >= 95 ? ' err' : (pct >= 75 ? ' warn' : ''));
    meta.innerHTML = '<span>'+prettySize(used)+' used · '+prettySize(TOTAL_LIMIT - used)+' free</span>' +
      '<span>'+Routes._raiseAttachments.length+' file' + (Routes._raiseAttachments.length === 1 ? '' : 's') + ' · '+pct+'%</span>';
  }
  function prettySize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(bytes<10240?1:0) + ' KB';
    return (bytes/1024/1024).toFixed(bytes<10485760?2:1) + ' MB';
  }

  function aiClassifyRun() {
    var desc = val('e-desc');

    var out = document.getElementById('e-ai-out');
    out.textContent = 'Thinking…';
    rpc('ai.classifyEscalation', { description: desc }).then(function(r){
      // Apply if user hasn't touched fields
      var catSel = document.getElementById('e-cat'); var sevSel = document.getElementById('e-sev');
      if (r.category) { for (var i=0;i<catSel.options.length;i++) if (catSel.options[i].value === r.category) { catSel.selectedIndex = i; break; } }
      if (r.severity) { for (var j=0;j<sevSel.options.length;j++) if (sevSel.options[j].value === r.severity) { sevSel.selectedIndex = j; break; } }
      if (r.suggestedAction) {
        var ea = document.getElementById('e-action');
        if (!ea.value.trim()) ea.value = r.suggestedAction;
      }
      out.textContent = 'Suggested: ' + r.category + ' · ' + r.severity + ' — ' + (r.reason || '');
    }).catch(function(e){ out.textContent = 'AI: ' + e.message; });
  }

  function attachClientPrefill(clientSelId, brcodeId, nameId, phoneId) {
    var sel = document.getElementById(clientSelId);

        };
        set(brcodeId, b.BranchCode);
        set(nameId,   b.CruxPOCName);
        set(phoneId,  b.CruxPOCMobile);
        if (live.length > 1) toast(live.length + ' branches on this client - check the branch code','info');
      }).catch(function(){});
    };
  }

  // One cached fetch of the directory, reused by every people dropdown. Typed
  // names were landing in fields the tool matches on email, so those records only
  // ever got corrected by hand in the sheet.
  /* Draft-with-AI control for any textarea.
     This helper had SEVEN call sites and no definition - it was lost in a later
     full-file replacement, which is why scoring threw 'attachAiDraft is not
     defined'. It fails soft: if the AI is unavailable the button reports it and
     whatever the user typed is untouched. */
  function attachAiDraft(textareaId, kind, contextFn) {
    setTimeout(function() {
      var ta = document.getElementById(textareaId);
      if (!ta || ta.__aiWired) return;
      ta.__aiWired = true;
      var bar = document.createElement('div');
      bar.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:4px';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn secondary small';
      btn.textContent = 'Draft with AI';
      btn.setAttribute('data-testid', 'ai-draft-' + textareaId);
      var note = document.createElement('span');
      note.className = 'muted';
      note.style.fontSize = '11px';
      note.textContent = 'Type a few rough words, then let AI tidy them up.';
      btn.onclick = function(ev) {
        ev.preventDefault(); ev.stopPropagation();
        var rough = String(ta.value || '').trim();
        if (rough.length < 3) { toast('Write a few words first.','err'); return false; }
        btn.disabled = true; note.textContent = 'Drafting...';
        rpc('ai.draftNote', { kind: kind, text: rough, context: contextFn ? contextFn() : '' })
          .then(function(r) {
            ta.value = (r && r.text) ? r.text : rough;
            ta.dispatchEvent(new Event('input', { bubbles: true }));
            note.textContent = 'Drafted. Edit freely before saving.';
            btn.disabled = false;
          })
          .catch(function(e) {
            note.textContent = '';
            toast('AI could not draft that: ' + e.message, 'err');
            btn.disabled = false;
          });
        return false;
      };
      bar.appendChild(btn); bar.appendChild(note);
      if (ta.parentNode) ta.parentNode.appendChild(bar);
    }, 60);
  }

  function fillPeopleSelect(id, current, opts) {
    opts = opts || {};

    if (!sel) return;
    loadPeople().then(function(list){
      sel.innerHTML = '';
      var blank = document.createElement('option');
      blank.value = ''; blank.textContent = opts.blankLabel || '- none -';
      sel.appendChild(blank);
      list.forEach(function(p){
        if (opts.exclude && String(opts.exclude).toLowerCase() === p.Email) return;
        var o = document.createElement('option');
        o.value = p.Email;
        o.textContent = p.Name + '  (' + p.Email + ')' + (p.Designation ? '  - ' + p.Designation : '');
        if (String(current||'').toLowerCase() === p.Email) o.selected = true;
        sel.appendChild(o);
      });
      // Keep a stored value that is not in the list visible rather than wiping it.
      if (current && !list.some(function(p){ return p.Email === String(current).toLowerCase(); })) {
        var keep = document.createElement('option');
        keep.value = current; keep.textContent = current + '  (not in directory)';
        keep.selected = true; sel.appendChild(keep);
      }
    }).catch(function(){});
  }

  var ORG_LADDERS = {
    Operations: ['Executive','Team Leader','Branch Manager','Partner','Zonal Manager','AVP','Operations Head','MD'],
    OTHER:      ['Executive','Team Leader','Manager','AVP','Operations Head','MD']
  };
  function suggestRoleClient(dept, desig) {
    if (desig === 'MD' || desig === 'Operations Head') return 'ADMIN';
    if (dept !== 'Operations') return 'VIEWER';
    if (desig === 'AVP' || desig === 'Zonal Manager') return 'MANAGER';
    if (desig === 'Branch Manager' || desig === 'Partner') return 'LOCATION_HEAD';
    return 'VIEWER';
  }
  var DESIG_RANK = { 'Executive':1,'Team Leader':2,'Branch Manager':3,'Partner':3,
    'Manager':3,'Zonal Manager':4,'AVP':5,'Operations Head':6,'MD':7 };
  function capabilitySummary(dept, desig, etype) {
    var rank = DESIG_RANK[desig] || 1;
    var partner = String(etype||'') === 'PARTNER';
    var team = rank >= 2;
    var matrix = partner || rank >= 6 || (dept === 'Operations' && team);
    var lines = [];
    lines.push('&bull; Raise and log escalations, and see their own targets');
    lines.push(team
      ? '&bull; Manage their team: targets, appreciation, PIP and warnings for direct reports'
      : '&bull; <b>No team</b>, so view only - cannot issue warnings, PIPs or appreciations');
    lines.push(matrix
      ? '&bull; Maintain client branches and escalation matrices'
      : '&bull; No access to clients or the escalation matrix');
    if (rank >= 6) lines.push('&bull; Admin console, and the whole company');
    return lines.join('<br>');
  }
  function paintUserOrg(u) {
    var dept = val('u-dept') || 'Operations';
    var list = ORG_LADDERS[dept === 'Operations' ? 'Operations' : 'OTHER'];
    var sel = document.getElementById('u-desig');
    if (sel) {
      var keep = sel.value || (u && u.Designation) || '';
      sel.innerHTML = '';
      list.forEach(function(d){
        var o = document.createElement('option'); o.value = d; o.textContent = d;
        if (d === keep) o.selected = true;
        sel.appendChild(o);
      });
    }
    var desig = val('u-desig');
    var hint = document.getElementById('u-role-hint');
    if (hint) hint.innerHTML = capabilitySummary(dept, desig, val('u-etype'));
  }

  function tplPreviewHtml(raw, signature) {
    var out = String(raw || '');
    var vals = {};
    Object.keys(TPL_SAMPLE).forEach(function(k){ vals[k] = TPL_SAMPLE[k]; });
    vals.SIGNATURE = signature || '<p>Warm regards,<br/>Team Crux Risk Management</p>';
    Object.keys(vals).forEach(function(k) {
      out = out.split('{{' + k + '}}').join(vals[k]);
    });
    // anything still unresolved gets flagged rather than silently shipped
    return out.replace(/\{\{([A-Z_]+)\}\}/g,
      '<span style="background:#ffe08a;border-radius:3px;padding:0 3px">$1 not set</span>');
  }

      ])

    /* ---- Health check (preflight) ----
       Turns "is this deployment actually correct?" into one button.
       Every failure carries its exact fix, so nobody has to read code. */
    var health = h('div',{class:'card', style:'margin-top:14px'},[]);
    body.appendChild(health);

    function paintHealth(mode) {
      health.innerHTML = '';
      health.appendChild(h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap'},[
        h('div',{},[
          h('h3',{style:'margin:0'},['Health check']),
          h('p',{class:'muted', style:'margin:4px 0 0'},['Verifies security, files, data columns, settings, automation and email quota.'])
        ]),
        h('button',{class:'btn', testid:'btn-run-preflight', onclick: runHealth},[mode === 'running' ? 'Checking...' : 'Run health check'])
      ]));
      if (mode === 'running') health.appendChild(h('p',{class:'muted', style:'margin-top:12px'},['Running checks...']));
    }

    function hbadge(level) {
      var map = { pass:['ok','PASS'], warn:['warn','NOTE'], fail:['err','FAIL'] };
      var mm = map[level] || map.pass;
      return h('span',{class:'badge '+mm[0], style:'flex:0 0 auto'},[mm[1]]);
    }

    function runHealth() {
      paintHealth('running');
      rpc('admin.preflight').then(function(r) {
        paintHealth('idle');
        health.appendChild(h('div',{class:'callout '+(r.go?'ok':'err'), style:'margin-top:12px'},[
          h('b',{},[r.go ? 'GO - no blocking problems found.' : 'NO-GO - ' + r.counts.failed + ' blocking problem(s).']),
          h('div',{style:'margin-top:6px'},[r.nextStep])
        ]));
        health.appendChild(h('div',{class:'muted', style:'margin:10px 0 6px'},[
          r.counts.passed + ' passed - ' + r.counts.failed + ' failed - ' + r.counts.notes + ' notes'
        ]));
        var list = h('div',{style:'display:flex;flex-direction:column;gap:8px'},[]);
        (r.ordered || []).forEach(function(i) {
          list.appendChild(h('div',{
            style:'display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:'
              + (i.level==='fail' ? 'rgba(220,38,38,.06)' : i.level==='warn' ? 'rgba(217,119,6,.06)' : 'rgba(0,0,0,.02)')
          },[
            hbadge(i.level),
            h('div',{style:'flex:1'},[
              h('div',{},[h('span',{class:'mono muted', style:'margin-right:8px'},[i.group]), i.msg]),
              i.fix ? h('div',{class:'muted', style:'margin-top:4px;font-size:.9em'},['Fix: ' + i.fix]) : null
            ])
          ]));
        });
        health.appendChild(list);
      }).catch(function(e) {
        paintHealth('idle');
        health.appendChild(h('div',{class:'callout err', style:'margin-top:12px'},[
          'Could not run the health check: ' + e.message,
          h('div',{class:'muted', style:'margin-top:6px'},['If this says preflightReport_ is not defined, Preflight.gs is missing.'])
        ]));
      });
    }

    /* ---- Sending address ----
       Gmail permits only this account's own address plus VERIFIED send-as
       aliases. There is no OAuth consent flow for send-as, so instead of
       pretending, show the addresses Gmail actually allows and let you pick. */
    var sender = h('div',{class:'card', style:'margin-top:14px'},[]);
    body.appendChild(sender);
    function paintSender() {
      sender.innerHTML = '<div class="empty">Checking sending addresses...</div>';
      rpc('admin.email.aliases').then(function(info) {
        sender.innerHTML = '';

          'Emails currently send as ' + (info.configured || info.account)
          + '. Only this account and its verified Gmail aliases can be used.']));
        // If the alias list could not be read, say so plainly and fall back to a
        // text box. A dropdown that cannot list the address makes a correctly

        if (info.aliasError) {

            h('b',{},['Cannot read your Gmail alias list.']),
            h('div',{},['Type the address below instead - it will be used as long as Gmail accepts it.']),
            h('div',{class:'muted', style:'font-size:11px;margin-top:4px'},[
              'Reason: ' + info.aliasError]),
            h('div',{class:'muted', style:'font-size:11px'},[
              'This usually means the deployment needs re-authorising after the Gmail settings scope was added: ' +

        }

        (info.aliases || []).forEach(function(a){

        }
        var useTyped = !!info.aliasError;
        sender.appendChild(h('div',{class:'form-row'},[
          h('div',{class:'field'},[h('label',{},['Send emails as']),
            useTyped
              ? h('input',{ id:'from-addr', testid:'input-from-address', value: info.configured || '',
                  placeholder:'operations.alert@cruxindia.co.in' })

        } else if (!info.configuredIsAllowed) {
          sender.appendChild(h('div',{class:'callout err', style:'margin-top:10px'},[
            'FROM_ADDRESS is set to ' + info.configured + ', which Gmail will not allow. Sending will fail until this is fixed.'

        }
      }).catch(function(e){
        sender.innerHTML = '';
        sender.appendChild(h('div',{class:'callout err'},['Could not read sending addresses: ' + e.message]));

    paintSender();

  function exportCurrentLog() {
    var tab = state.routeParams.tab || 'Email';
    var table = tab === 'Email' ? 'EMAIL_LOG' : (tab === 'Audit' ? 'AUDIT_LOG' : 'REMINDER_LOG');
    var filters = Object.assign({}, state.routeParams.logFilters || {});
    delete filters._q;
    rpc('admin.export.csv', { table: table, filters: filters }).then(function(res){ downloadBase64(res.filename, res.mime, res.dataBase64); toast('Exported '+res.rowCount+' rows','ok'); }).catch(function(e){ toast(e.message,'err'); });
  }
  function downloadBase64(filename, mime, base64) {
    var bin = atob(base64); var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  function loadLog(body, action, cols, filters) {
    body.innerHTML = '<div class="empty">Loading…</div>';
    rpc(action, { filters: filters || {}, size: 500 }).then(function(res){
      body.innerHTML = '';
      if (!res.rows.length) { body.appendChild(h('div',{class:'empty'},['No rows match your filters.'])); return; }
      var t = h('table',{class:'table', testid:'table-log'},[h('thead',{},[h('tr',{}, cols.map(function(c){ return h('th',{},[c]); }))])]);
      var tb = h('tbody',{},[]);
      res.rows.forEach(function(r){
        tb.appendChild(h('tr',{class:'no-hover'}, cols.map(function(c){
          if (c === 'Status') return h('td',{},[h('span',{class:'badge '+(r[c]==='SENT'?'ok':(r[c]==='FAILED'?'err':'info'))},[String(r[c]||'')])]);
          if (c === 'Result') return h('td',{},[h('span',{class:'badge '+(r[c]==='OK'?'ok':'warn')},[String(r[c]||'')])]);
          return h('td',{},[String(r[c] == null ? '' : r[c]).slice(0, 200)]);
        })));
      });
      t.appendChild(tb); body.appendChild(t);
      body.appendChild(h('div',{class:'muted', style:'margin-top:8px'},[res.total + ' row(s) match']));
    }).catch(function(e){ body.innerHTML = ''; body.appendChild(h('div',{class:'callout err'},[e.message])); });
  }

  });
})();

  // Deep-link actions: open a dialog straight from the URL.
  if (DEEP && DEEP.action) {
    setTimeout(function() {
      try {
        if (DEEP.action === 'raise' && typeof openRaiseEscalation === 'function') openRaiseEscalation();
        else if (DEEP.action === 'log' && typeof openLogEscalation === 'function') openLogEscalation();
        else if (DEEP.action === 'warning' && typeof openPickEscalationForWarning === 'function') openPickEscalationForWarning();
      } catch (err) {}
    }, 1500);
  }

  var ORG_LADDER = {
    Operations: ["Executive","Team Leader","Branch Manager","Partner","Zonal Manager","AVP","Operations Head","MD"],
    OTHER: ["Executive","Team Leader","Manager","AVP","Operations Head","MD"]
  };
  function refreshDesignations() {
    var dept = val('department') || 'Operations';
    var pw = document.getElementById('partner-wrap');
    if (pw) pw.style.display = val('employeeType') === 'PARTNER' ? '' : 'none';
    var list = ORG_LADDER[dept === 'Operations' ? 'Operations' : 'OTHER'];
    var sel = document.getElementById('designation');
    var hint = document.getElementById('dept-hint');
    if (sel) {
      sel.innerHTML = '';
      list.forEach(function(d){
        var o = document.createElement('option'); o.value = d; o.textContent = d; sel.appendChild(o);
      });
    }
    if (hint) {
      hint.textContent = dept === 'Operations'
        ? 'Operations staff maintain branch escalation matrices.'
        : dept + ' staff use escalations and warnings only - no escalation matrix.';
    }
  }

</script>
